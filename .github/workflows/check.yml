name: check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    # Keep the Qt 6.4 compatibility check stable as ubuntu-latest advances.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install the checkers used by scripts/check.sh
        timeout-minutes: 12
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends \
            nodejs \
            python3 \
            lua5.4 \
            qt6-declarative-dev-tools \
            qml6-module-qtcore \
            qml6-module-qt-labs-folderlistmodel \
            qml6-module-qtqml \
            qml6-module-qtqml-workerscript \
            qml6-module-qtqml-models \
            qml6-module-qtquick \
            qml6-module-qtquick-controls \
            qml6-module-qtquick-templates \
            qml6-module-qtquick-dialogs \
            qml6-module-qtquick-layouts \
            qml6-module-qtquick-window \
            qml6-module-qttest
      - name: Report checker versions
        run: |
          python3 --version
          node --version
          /usr/lib/qt6/bin/qmltestrunner -help
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Run scripts/check.sh
        timeout-minutes: 8
        run: scripts/check.sh
