name: check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the checkers used by scripts/check.sh
        run: |
          sudo apt-get update
          sudo apt-get install -y nodejs python3 qt6-declarative-dev-tools
      - name: Run scripts/check.sh
        run: scripts/check.sh
