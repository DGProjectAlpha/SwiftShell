# SwiftShell fallback. An existing user hyprlock.conf always takes precedence.
general {
    hide_cursor = true
}
animations {
    enabled = false
}
background {
    monitor =
    path = screenshot
    color = rgba(161616ff)
    blur_passes = 3
    blur_size = 6
}
input-field {
    monitor =
    size = 300, 52
    outline_thickness = 1
    inner_color = rgba(202020e6)
    outer_color = rgba(ffffff33)
    check_color = rgba(ffffff88)
    fail_color = rgba(888888ff)
    font_color = rgba(f2f2f2ff)
    font_family = Sans
    fade_on_empty = false
    rounding = 12
    placeholder_text = Password
    fail_text = Try again
    position = 0, -30
    halign = center
    valign = center
}
label {
    monitor =
    text = Locked
    color = rgba(f2f2f2ff)
    font_size = 22
    font_family = Sans
    position = 0, 60
    halign = center
    valign = center
}
